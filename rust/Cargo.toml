[package]
name = "rust_lib_mreader"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

# 移植自 `rust_reader_kernel` 的解析内核以 vendored crates 形式挂在
# `vendor/rrk-*`（见 `rust/vendor/README.md`）；本清单同时是 workspace 根。
[workspace]
resolver = "2"
members = ["vendor/*"]

[workspace.package]
# 与上游 rust_reader_kernel 的 workspace.package.version 同步（vendored crate 用
# `version.workspace = true` 解析到此处；上游 0.3.0 = 内核 ABI 10，含 issue #13
# 无 TOC 章标题回填 / fuzz 五轮加固 / PDF 页面树防线）。
version = "0.3.0"
edition = "2021"
# 与内核上游一致：MIT OR Apache-2.0（vendored 代码的许可）。
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rrk-model = { path = "vendor/rrk-model" }
rrk-format = { path = "vendor/rrk-format" }
rrk-markup = { path = "vendor/rrk-markup" }
rrk-zip = { path = "vendor/rrk-zip" }
rrk-txt = { path = "vendor/rrk-txt" }
rrk-epub = { path = "vendor/rrk-epub" }
rrk-mobi = { path = "vendor/rrk-mobi" }
rrk-cbz = { path = "vendor/rrk-cbz" }
rrk-pdf = { path = "vendor/rrk-pdf" }
rrk-image = { path = "vendor/rrk-image" }
rrk-search = { path = "vendor/rrk-search" }
rrk-cache = { path = "vendor/rrk-cache" }
rrk-kernel = { path = "vendor/rrk-kernel" }
# 内核依赖白名单（上游 `rust_reader_kernel` Cargo.toml §3.2 同源）：
# 纯 Rust、可审计、可 fork、许可宽松。
encoding_rs = "0.8"      # 编码转换（Firefox 同源，纯 Rust）
chardetng = "0.1"        # 编码检测（纯 Rust）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] } # inflate（miniz_oxide 纯 Rust）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] } # CBZ/PDF 图像（tiff 随上游同步加入，rrk-image thumbnail 运行期解码）

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# 与 Dart 侧 `flutter_rust_bridge` 运行时**严格同版本**（RUST-08；codegen 也须 2.13.0）。
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
# `M35-T03` ③：KF8 最小验证对象（PRD `Q25`；测试 rust/tests/kf8_gate.rs）。
# 结论未出前不进任何业务链路——只被该 gate 测试引用。
mobi = "0.8"
# 移植的 Rust 阅读内核（图书解析核心）：会话编排（句柄表）+ 统一数据模型 +
# 格式适配契约（ContentSource）。
rrk-kernel.workspace = true
rrk-model.workspace = true
rrk-format.workspace = true

# `RUST-04` / 架构 §D.2：panic 必须显式 unwind——`catch_unwind` 在 abort 下失效，
# panic 会直接终止进程。两处显式写死，让「改成 abort」变成一次显眼的 diff
# （机械护栏：test/rust_profile_guard_test.dart）。
[profile.dev]
panic = "unwind"
opt-level = 1
debug = true

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
