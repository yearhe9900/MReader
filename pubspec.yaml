name: mreader
description: "阅读M（MReader）：纯 Flutter 自绘 + 纯 Dart 解析 EPUB，纵向滚动阅读。"
publish_to: 'none'
version: 0.1.0

# 用户已拍板：Flutter 3.44.9-stable 内置 Dart 3.12.2
environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter

  # 选择本地 EPUB 文件（Android/iOS/Windows/macOS/Linux）。
  file_picker: ^8.1.2
  # 解压 EPUB（本质就是 zip）。
  # 注意：固定在 3.x，因为 4.x 改了 ArchiveFile 的 API。
  archive: ^3.6.1
  # 解析 META-INF/container.xml 与 OPF（严格 XML，必须用真 XML 解析器）。
  xml: ^6.5.0
  # 路径拼接与 '../' 归一化（posix 语义，纯字符串处理）。
  path: ^1.9.0
  # 解析 XHTML。真实 EPUB 的 XHTML 很脏，html 包的宽松解析比 xml 包更能扛。
  html: ^0.15.4
  # 中文 EPUB 常见 GBK/GB18030 编码，Dart 标准库不支持，用它做解码兜底。
  charset: ^2.0.1
  # 定位应用私有数据目录（DATA-01 落盘根、TYP-03 设置持久化）。
  # Flutter 官方插件，五平台覆盖（Android/iOS/Windows/macOS/Linux）。
  # 仅在 lib/platform/app_paths.dart 的实现里使用；lib/ 业务代码只依赖 AppPaths 抽象。
  path_provider: ^2.1.5
  # 玻璃态视觉（UI-01 基础设施 / UI-04 内容层不透明红线 / §11）。
  # **精确锁定 1.7.0（不带 ^）**：负责人明确决定采用 1.7.0。
  # 注：PRD §11.4 的已知限制原针对 1.6.2 实测；升级后若有行为差异需重新验证。
  liquid_glass_widgets: 1.7.0
  # PRD §11.4 列为**强制依赖**：玻璃图标依赖它，从 pubspec 移除会导致图标显示为 `?`。
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter create 默认生成的 analysis_options.yaml 依赖它。
  # 注意：flutter_lints 的规则文件名是 flutter.yaml（不是 flutter_lints.yaml）。
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
