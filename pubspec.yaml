name: mreader
description: "阅读M（MReader）：纯 Flutter 自绘 + 纯 Dart 解析 EPUB，纵向滚动阅读。"
publish_to: 'none'
version: 0.1.0

# 用户已拍板（2026-09-24 升级）：Flutter 3.47.5-stable 内置 Dart 3.13.4
# （为解锁 pdfrx 2.6.5（需 Dart ≥3.13）由 3.44.9 / 3.12.2 升上）。
environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # 选择本地 EPUB 文件（Android/iOS/Windows/macOS/Linux）。
  file_picker: ^8.1.2
  # 解压 EPUB（本质就是 zip）。
  # 3.x → 4.3.0（2026-09-24 迁移，决定性论据）：pdfrx 2.6.x → pdfrx_engine（0.1.0 起全线）
  # 硬要求 archive ^4.x，无任何「2.6.x + archive 3.x」组合；Q4① 拍板定版 pdfrx 2.6.5 不可让。
  # 迁移面收窄在 `lib/epub/zip_paths.dart` 两个辅助函数（`content`→`readBytes()`、
  # `compressionType` 整型常量→`CompressionType` 枚举、`inflateBuffer`→`decompress(output)`），
  # 辅助函数签名不变 → epub_parser / cbz_source 调用点零改动；PERF-02 非驻留语义逐条保持
  # （4.x `decompress(output)` 带输出即不落 `_content` 缓存，语义更原生），parse 组回归兜底。
  # 精确锁定版本（不带 ^）：与 crypto 同款锁定纪律。
  archive: 4.3.0
  # 解析 META-INF/container.xml 与 OPF（严格 XML，必须用真 XML 解析器）。
  xml: ^6.5.0
  # 路径拼接与 '../' 归一化（posix 语义，纯字符串处理）。
  path: ^1.9.0
  # 解析 XHTML。真实 EPUB 的 XHTML 很脏，html 包的宽松解析比 xml 包更能扛。
  html: ^0.15.4
  # 中文 EPUB 常见 GBK/GB18030 编码，Dart 标准库不支持，用它做解码兜底。
  charset: ^2.0.1
  # SHA-256 哈希（LIB-05 内容摘要判重；Dart 官方包，纯 Dart，零 Flutter 依赖）。
  # 精确锁定版本（不带 ^）：Dart 官方纯 Dart 包，版本锁定避免隐式升级引入差异。
  # 3.0.6 → 3.0.7（2026-09-24，最小偏差）：pdfrx 2.6.5 → pdfrx_engine ^0.6.1 硬要求
  # crypto ^3.0.7；补丁级提升，SHA-256 摘要输出与包版本无关 → bookId 判重键不变（LIB-05 语义零变化）。
  crypto: 3.0.7
  # 定位应用私有数据目录（DATA-01 落盘根、TYP-03 设置持久化）。
  # Flutter 官方插件，五平台覆盖（Android/iOS/Windows/macOS/Linux）。
  # 仅在 lib/platform/app_paths.dart 的实现里使用；lib/ 业务代码只依赖 AppPaths 抽象。
  path_provider: ^2.1.5
  # 玻璃态视觉（UI-01 基础设施 / UI-04 内容层不透明红线 / §11）。
  # **精确锁定 1.7.0（不带 ^）**：负责人明确决定采用 1.7.0。
  # 注：PRD §11.4 的已知限制原针对 1.6.2 实测；升级后若有行为差异需重新验证。
  liquid_glass_widgets: 1.7.0
  # PRD §11.4 列为**强制依赖**：玻璃图标依赖它，从 pubspec 移除会导致图标显示为 `?`。
  cupertino_icons: ^1.0.8
  # PDF 渲染（FMT-01 / META-10，Q4 拍板①主选 = pdfrx 2.6.5）。
  # **精确锁定 2.6.5（不带 ^）**：Q4 拍板①原文定版（2026-09-24）；
  # 需 Flutter ≥3.47 / Dart ≥3.13 —— 已随 Flutter 3.47.5 升级满足（同日拍板「升级 Flutter」解锁）。
  # 接入走**注入式接口** `lib/platform/pdf_engine.dart`（Q4 验收①，对齐 RarExtractor 注入缝）；
  # 全仓唯一直接 import pdfrx 的文件 = `lib/platform/pdfrx_pdf_engine.dart`。
  # 已知约束（Q4 拍板③接受）：Windows 构建需开启 Developer Mode（构建机一次性）。
  pdfrx: 2.6.5
  # 系统 TTS（TTS-01/02 段落朗读；M3-T06）。仅 `lib/tts/system_tts.dart` 直接引用。
  # **精确锁定 4.2.5（不带 ^）**：版本锁定纪律（同 archive/crypto/pdfrx）。
  # 包无 linux/ 实现 → Linux 上 invokeMethod 抛 MissingPluginException →
  # `init()` 返回 false → UI 层中文提示「本机未安装语音引擎」（PRD §15.3 不静默失败）。
  # 缓存在手（`D:\pub_cache`），`flutter pub get --offline` 可解析。
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter create 默认生成的 analysis_options.yaml 依赖它。
  # 注意：flutter_lints 的规则文件名是 flutter.yaml（不是 flutter_lints.yaml）。
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
